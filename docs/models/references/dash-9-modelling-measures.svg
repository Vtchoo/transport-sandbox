<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Dash 9 modelling dimensions — side, front and bogie views</title>
  <desc id="desc">Schematic locomotive views with metre dimensions: 22.3012 coupling length, provisional 14.0970 bogie reference spacing, provisional 3.1242 cab width and 4.6990 cab-top height, 1.8034 deck height, 1.0668 new-wheel diameter and 1.435 standard gauge. Bogie outer-axle span is approximately 4.0132 in the selected ATSF drawing. Outline details are schematic; axle stations are derived from the selected ATSF drawing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#243c54"/></marker>
    <g id="wheel"><circle r="1" fill="#e3eaf0" stroke="#243c54" stroke-width=".055"/><circle r=".25" fill="#859bab"/><path d="M-1.2 0H1.2M0-1.2V1.2" stroke="#6a8191" stroke-width=".025"/></g>
    <style>
      text{font-family:Arial,sans-serif;font-size:16px;fill:#19334b}
      .title{font-size:29px;font-weight:700}.section{font-size:20px;font-weight:700}
      .small{font-size:13px;fill:#526a7d}.label{font-weight:700}.accent{fill:#a35e15}
      .shape{fill:#edf3f7;stroke:#516f83;stroke-width:1.7;stroke-linejoin:round}
      .detail{fill:none;stroke:#8ca0af;stroke-width:1.2}
      .guide{fill:none;stroke:#639aab;stroke-width:1;stroke-dasharray:6 5}
      .ext{fill:none;stroke:#9bafbd;stroke-width:1}
      .dim{fill:none;stroke:#243c54;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
      .unknown{fill:none;stroke:#bb8739;stroke-width:1.5;stroke-dasharray:6 5}
    </style>
  </defs>
