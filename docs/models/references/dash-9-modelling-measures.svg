  <text x="580" y="956" class="small">Bogie frame width/height and traction-pin offset: unmeasured.</text>

  <rect x="40" y="988" width="1120" height="107" rx="7" fill="#edf3f7"/>
  <text x="57" y="1013" class="small">* Provisional / variant-dependent. Axle datums follow the selected ATSF PNG; mechanical swivel positions still need verification.</text>
  <text x="57" y="1036" class="small">Frame length reference: 21.1328. Its position relative to coupling faces is not established by this sheet.</text>
  <text x="57" y="1059" class="small">Still needed for detailed modelling: nose length, cab depth, hood width, roof sections, radiator dimensions and coupler height.</text>
  <text x="57" y="1082" class="small">Sources and qualifications: dash-9-sketchup-reference.md. Cab top excludes horns/antennas; cab width excludes wider fittings.</text>
